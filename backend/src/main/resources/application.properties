spring.application.name=backend

server.error.whitelabel.enabled=false

spring.datasource.url=jdbc:mysql://localhost:3306/backend?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true

# Variables de entorno
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.maximum-pool-size=10

# Caducidad de sesi\u00f3n
server.servlet.session.timeout=15m

# ===========================
# JPA / HIBERNATE
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# GROQ
groq.api.key=${GROQ_APIKEY}
groq.model=llama-3.1-8b-instant

# TESSERACT
tesseract.path=C:/Program Files/Tesseract-OCR/tesseract.exe
tesseract.data=C:/Program Files/Tesseract-OCR/tessdata

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# CONFIGURACI\u00d3N DE EMAIL (GOOGLE)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=dahdadou@alumnat.copernic.cat
spring.mail.password=${MAIL_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# CONFIGURACI\u00d3N HTTPS / SSL (RN66)
# ===============================
# Cambiamos el puerto por defecto (8080) al puerto est\u00e1ndar de HTTPS
server.port=8443

# Activamos la conexi\u00f3n segura
server.ssl.enabled=true

# Ruta al certificado que has generado en la carpeta resources
server.ssl.key-store=classpath:keystore.p12

# Contrase\u00f1a del certificado (\u00a1A\u00f1ade esta variable a tu entorno!)
server.ssl.key-store-password=${KEYSTORE_PASSWORD}

# Formato y alias del certificado
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=springboot