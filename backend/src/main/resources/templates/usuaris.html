<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuaris</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<div th:replace="layout/sidebar :: sidebar"></div>

<div class="content">

    <h2 class="mb-4">Lista de usuarios</h2>

    <div th:if="${missatge}" class="alert alert-danger" th:text="${missatge}"></div>
    
    <form method="get" id="filterForm" class="mb-4 p-3 rounded shadow-sm" style="background-color: #efebe9; border: 1px solid #d7b899;">
        <div class="row g-2 align-items-end mb-3">
            <div class="col-md-4 col-sm-6">
                <label class="form-label text-muted small fw-bold mb-1">Nombre o Apellidos</label>
                <input type="text" name="query" class="form-control form-control-sm" th:value="${query}" placeholder="Nombre de usuario...">
            </div>

            <div class="col-md-2 col-sm-12 d-flex gap-2">
                <button type="submit" class="btn btn-brown-primary btn-brown-sm flex-grow-1">Filtrar</button>
                <a href="/usuaris" class="btn btn-brown-warning btn-brown-sm flex-grow-1">Limpiar</a>
            </div>
        </div>

        <hr style="border-color: #d7b899; opacity: 0.5;" class="m-0 mb-2">

        <div class="d-flex justify-content-end align-items-center gap-2 mt-2">
            <label class="text-muted small fw-bold mb-0">Ordenar por Nombre Completo:</label>

            <div class="input-group input-group-sm w-auto shadow-sm">
                <input type="hidden" name="asc" id="ascInput" th:value="${asc}">

                <button class="btn" 
                        style="background-color: #8d6e63; color: white; border-color: #8d6e63;" 
                        type="button" 
                        onclick="toggleAsc()">
                    <span th:text="${asc ? '⬆️ Asc' : '⬇️ Desc'}"></span>
                </button>
            </div>
        </div>
    </form>

    <script>
        function toggleAsc() {
            const ascInput = document.getElementById('ascInput');
            ascInput.value = ascInput.value === 'true' ? 'false' : 'true';
            document.getElementById('filterForm').submit();
        }
        
        function ampliarFoto(srcDeLaFoto) {
            document.getElementById('imagenGrande').src = srcDeLaFoto;
        }
    </script>

    <div th:each="u : ${usuaris}" class="card-item d-flex justify-content-between align-items-center">

        <div class="d-flex align-items-center gap-3">
            
            <img th:if="${u.fotoPerfil != null}" 
                 th:src="${u.fotoPerfil}" 
                 class="rounded-circle border shadow-sm" 
                 style="width: 45px; height: 45px; object-fit: cover; cursor: zoom-in;" 
                 alt="Perfil"
                 data-bs-toggle="modal" 
                 data-bs-target="#fotoModal"
                 onclick="ampliarFoto(this.src)">
                 
            <svg th:unless="${u.fotoPerfil != null}" 
                 xmlns="http://www.w3.org/2000/svg" 
                 width="45" height="45" 
                 fill="#8d6e63" 
                 class="bi bi-person-circle" 
                 viewBox="0 0 16 16">
                <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
            </svg>

            <div>
                <h5 class="mb-0" th:text="${u.nom + ' ' + u.cognoms}"></h5>
                <small class="text-muted"
                       th:text="${u.esAdmin ? 'Administrador/a' : 'Usuario común'}">
                </small>
            </div>
            
        </div>

        <div class="d-flex align-items-center gap-2">

            <a th:href="@{'/usuaris/modUsuari/' + ${u.id}}"
               class="btn btn-brown-warning btn-brown-sm">
                Editar
            </a>

            <button type="button"
                    class="btn btn-brown-primary btn-brown-sm btn-delete-user"
                    data-bs-toggle="modal"
                    data-bs-target="#deleteUserModal"
                    th:attr="data-id=${u.id}, data-nom=${u.nom + ' ' + u.cognoms}">
                Eliminar
            </button>

        </div>

    </div>

    <a href="/usuaris/nouUsuari"
       class="btn btn-brown-primary btn-brown-lg mt-3">
        + Crear usuario
    </a>

</div>

<div th:replace="fragments/modalUsuaris :: modalUsuaris"></div>

<div class="modal fade" id="fotoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="background-color: transparent; border: none;">
            <div class="modal-header border-0 d-flex justify-content-end p-2">
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" style="filter: invert(1);"></button>
            </div>
            <div class="modal-body text-center p-0">
                <img id="imagenGrande" src="" class="img-fluid rounded shadow-lg" style="max-height: 80vh; object-fit: contain;">
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/usuaris.js"></script>

</body>
</html>
