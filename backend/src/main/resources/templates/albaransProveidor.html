<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Albaranes proveedor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<div th:replace="~{layout/sidebar :: sidebar}"></div>

<div class="content">

    <h2 class="mb-4">Lista de albaranes de proveedor</h2>

    <div th:if="${ok}" class="alert alert-success" th:text="${ok}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form method="get" id="filterForm" class="mb-4 p-3 rounded shadow-sm" style="background-color: #efebe9; border: 1px solid #d7b899;">
        <div class="row g-2 align-items-end mb-3">
            <div class="col-md-2 col-sm-6">
                <label class="form-label text-muted small fw-bold mb-1">Nº Albarán</label>
                <input type="text" name="numAlbara" class="form-control form-control-sm" th:value="${param.numAlbara}" placeholder="Número de albarán...">
            </div>
            <div class="col-md-2 col-sm-6">
                <label class="form-label text-muted small fw-bold mb-1">Fecha</label>
                <input type="date" name="dataRecepcio" class="form-control form-control-sm" th:value="${param.dataRecepcio}">
            </div>
            <div class="col-md-3 col-sm-6">
                <label class="form-label text-muted small fw-bold mb-1">Proveedor</label>
                <input type="text" name="nomProveidor" class="form-control form-control-sm" th:value="${param.nomProveidor}" placeholder="Nombre proveedor...">
            </div>
            <div class="col-md-3 col-sm-6">
                <label class="form-label text-muted small fw-bold mb-1">Registrado por</label>
                <input type="text" name="nomCognomsUsuari" class="form-control form-control-sm" th:value="${param.nomCognomsUsuari}" placeholder="Nombre o apellido...">
            </div>
            
            <div class="col-md-2 col-sm-12 d-flex gap-2">
                <button type="submit" class="btn btn-brown-primary btn-brown-sm flex-grow-1">Filtrar</button>
                <a href="/albarans-proveidor" class="btn btn-brown-warning btn-brown-sm flex-grow-1">Limpiar</a>
            </div>
        </div>

        <hr style="border-color: #d7b899; opacity: 0.5;" class="m-0 mb-2">

        <div class="d-flex justify-content-end align-items-center gap-2 mt-2">
            <label class="text-muted small fw-bold mb-0">Ordenar por:</label>
            <div class="input-group input-group-sm w-auto shadow-sm">
                <select name="sortField" class="form-select" onchange="document.getElementById('filterForm').submit()" style="border-color: #d7b899; min-width: 130px;">
                    <option value="dataRecepcio" th:selected="${sortField == 'dataRecepcio'}">Fecha</option>
                    <option value="numAlbara" th:selected="${sortField == 'numAlbara'}">Nº Albarán</option>
                    <option value="proveidor" th:selected="${sortField == 'proveidor'}">Proveedor</option>
                    <option value="registratPer" th:selected="${sortField == 'registratPer'}">Registrado por</option>
                </select>
                
                <input type="hidden" name="asc" id="ascInput" th:value="${asc}">
                
                <button class="btn" style="background-color: #8d6e63; color: white; border-color: #8d6e63;" type="button" onclick="toggleAsc()">
                    <span th:text="${asc ? '⬆️ Asc' : '⬇️ Desc'}"></span>
                </button>
            </div>
        </div>
    </form>

    <script>
        function toggleAsc() {
            const ascInput = document.getElementById('ascInput');
            ascInput.value = ascInput.value === 'true' ? 'false' : 'true';
            document.getElementById('filterForm').submit();
        }
    </script>
    <th:block th:each="ap : ${albarans}">
        
        <div th:if="${ap != null}" class="card-item d-flex flex-column mb-3">

            <div class="d-flex justify-content-between align-items-center w-100">
                
                <div>
                    <h5 class="mb-1">
                        Albarán <span th:text="${ap.numAlbara}"></span>
                    </h5>

                    <small class="text-muted d-block">
                        Fecha recepción: <span th:text="${ap.dataRecepcio}"></span>
                    </small>

                    <small class="text-muted d-block">
                        Proveedor: <span th:text="${ap.proveidor?.nom ?: 'Desconocido'}"></span>
                    </small>

                    <small class="text-muted d-block">
                        Líneas: <span th:text="${ap.linies != null ? #lists.size(ap.linies) : 0}"></span>
                    </small>
                    
                    <small class="text-muted d-block mt-1">
                        Registrado por: 
                        <span class="fw-semibold text-secondary" 
                              th:text="${ap.registratPer != null ? ap.registratPer.nom + ' ' + ap.registratPer.cognoms : 'Sistema'}">
                        </span>
                    </small>
                </div>

                <div class="d-flex align-items-center gap-2">

                    <button type="button" 
                            class="btn btn-brown-secondary btn-brown-sm"
                            data-bs-toggle="collapse" 
                            th:data-bs-target="|#collapseLineas-${ap.id}|">
                        Ver detalles
                    </button>

                    <a th:href="@{|/albarans-proveidor/editar/${ap.id}|}"
                       class="btn btn-brown-warning btn-brown-sm"
                       th:classappend="${not #lists.isEmpty(ap.linies) and ap.linies[0]?.lot?.estatLot != null and ap.linies[0].lot.estatLot != T(cat.copernic.backend.enums.EstatLot).EN_ESTOC} ? ' btn-brown-disabled'">
                        Editar
                    </a>

                    <button type="button"
                            class="btn btn-brown-primary btn-brown-sm"
                            data-bs-toggle="modal"
                            data-bs-target="#deleteAlbaraModal"
                            th:data-id="${ap.id}"
                            th:data-num="${ap.numAlbara}"
                            th:classappend="${not #lists.isEmpty(ap.linies) and ap.linies[0]?.lot?.estatLot != null and ap.linies[0].lot.estatLot != T(cat.copernic.backend.enums.EstatLot).EN_ESTOC} ? ' btn-brown-disabled'">
                        Eliminar
                    </button>

                </div>
            </div>

            <div class="collapse mt-3 w-100" th:id="|collapseLineas-${ap.id}|">
                <hr style="border-top: 1px dashed #d7b899; opacity: 1;">
                <p class="fw-bold mb-2 small" style="color: #6d4c41;">Contenido del albarán:</p>
                
                <ul class="list-group list-group-flush" style="border-radius: 8px; overflow: hidden;" th:if="${not #lists.isEmpty(ap.linies)}">
                    <li th:each="linia : ${ap.linies}" 
                        class="list-group-item d-flex justify-content-between align-items-center"
                        style="background-color: #efebe9; border-color: #d7b899; color: #4e342e;">
                        
                        <span class="fw-medium">
                            Lote: <span th:text="${linia.lot?.numLot ?: 'N/A'}"></span>
                            <small class="text-muted ms-1" th:if="${linia.lot?.materia != null}" th:text="|(${linia.lot.materia.nom})|"></small>
                        </span>
                        
                        <span class="badge rounded-pill" style="background-color: #8d6e63; color: white;">
                            <span th:text="${linia.quantitat}"></span> 
                            <span th:text="${linia.unitats ?: ''}"></span>
                        </span>
                        
                    </li>
                </ul>
                
                <p th:if="${#lists.isEmpty(ap.linies)}" class="text-muted small mb-0 mt-2">No hay líneas registradas en este albarán.</p>
            </div>

        </div>
    </th:block>

    <a href="/albarans-proveidor/nouAlbaraProveidor"
       class="btn btn-brown-primary btn-brown-lg mt-3">
       + Crear albarán
    </a>

</div>

<form id="deleteAlbaraForm" method="post"></form>

<div th:replace="~{fragments/modalAlbaransProveidor :: modalAlbaransProveidor}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/albaransProveidor.js"></script>

</body>
</html>
