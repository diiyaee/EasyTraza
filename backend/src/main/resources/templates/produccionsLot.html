<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Producciones del lote</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">

    <style>
        .page-container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
    </style>
</head>

<body>

<div th:replace="~{layout/sidebar :: sidebar}"></div>

<div class="content">

    <div class="page-container">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">
                Producciones del lote
                <span class="text-muted" th:text="${lot.numLot}"></span>
            </h2>
        </div>
        
        <form method="get" id="filterForm" class="mb-4 p-3 rounded shadow-sm" style="background-color: #efebe9; border: 1px solid #d7b899;">
            
            <div class="row g-2 align-items-end mb-3">
                
                <div class="col-md-3 col-sm-6">
                    <label class="form-label text-muted small fw-bold mb-1">Producto</label>
                    <select name="producteId" class="form-select form-select-sm">
                        <option value="">Todos</option>
                        <option th:each="p : ${productes}"
                                th:value="${p.id}"
                                th:text="${p.nom}"
                                th:selected="${p.id.toString() == param.producteId?.toString()}">
                        </option>
                    </select>
                </div>

                <div class="col-md-3 col-sm-6">
                    <label class="form-label text-muted small fw-bold mb-1">Cliente</label>
                    <select name="clientId" class="form-select form-select-sm">
                        <option value="">Todos</option>
                        <option th:each="c : ${clients}"
                                th:value="${c.id}"
                                th:text="${c.nom}"
                                th:selected="${c.id.toString() == param.clientId?.toString()}">
                        </option>
                    </select>
                </div>

                <div class="col-md-3 col-sm-6">
                    <label class="form-label text-muted small fw-bold mb-1">Fecha de Producción</label>
                    <input type="date" name="dataProduccio" class="form-control form-control-sm" th:value="${param.dataProduccio}">
                </div>
                
                <div class="col-md-3 col-sm-12 d-flex gap-2">
                    <button type="submit" class="btn btn-brown-primary btn-brown-sm flex-grow-1">Filtrar</button>
                    <a th:href="@{'/lots/' + ${lot.id} + '/produccions'}" class="btn btn-brown-warning btn-brown-sm flex-grow-1">Limpiar</a>
                </div>
            </div>

            <hr style="border-color: #d7b899; opacity: 0.5;" class="m-0 mb-2">

            <div class="d-flex justify-content-end align-items-center gap-2 mt-2">
                <label class="text-muted small fw-bold mb-0">Ordenar por:</label>
                <div class="input-group input-group-sm w-auto shadow-sm">
                    
                    <select name="sortField" class="form-select" onchange="document.getElementById('filterForm').submit()" style="border-color: #d7b899; min-width: 130px;">
                        <option value="dataProduccio" th:selected="${sortField == 'dataProduccio'}">Fecha Prod.</option>
                        <option value="producte" th:selected="${sortField == 'producte'}">Producto</option>
                        <option value="client" th:selected="${sortField == 'client'}">Cliente</option>
                        <option value="quantitat" th:selected="${sortField == 'quantitat'}">Cantidad</option>
                    </select>
                    
                    <input type="hidden" name="asc" id="ascInput" th:value="${asc}">
                    
                    <button class="btn" style="background-color: #8d6e63; color: white; border-color: #8d6e63;" type="button" onclick="toggleAsc()">
                        <span th:text="${asc ? '⬆️ Asc' : '⬇️ Desc'}"></span>
                    </button>
                </div>
            </div>

        </form>

        <script>
            function toggleAsc() {
                const ascInput = document.getElementById('ascInput');
                ascInput.value = ascInput.value === 'true' ? 'false' : 'true';
                document.getElementById('filterForm').submit();
            }
        </script>

        <div class="w-100">

            <div class="card-item mb-2 fw-bold" style="background-color: #f8f9fa;">
                <div class="row w-100 text-center">
                    <div class="col-4">Producto</div>
                    <div class="col-2">Cantidad</div>
                    <div class="col-6">Cliente - Fecha (Albarán)</div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(linies)}" class="alert alert-secondary text-center mt-3">
                No hay líneas de producción que coincidan con la búsqueda.
            </div>

            <div th:each="l : ${linies}" class="card-item mb-2">
                <div class="row w-100 text-center align-items-center">

                    <div class="col-4">
                        <span class="fw-bold" th:text="${l.producte != null ? l.producte.nom : 'Desconocido'}"></span>
                    </div>

                    <div class="col-2">
                        <span class="badge rounded-pill" style="background-color: #8d6e63; color: white;" th:text="${l.quantitat}"></span>
                    </div>

                    <div class="col-6">
                        <span th:text="${l.albara?.client != null ? l.albara.client.nom : 'Desconocido'}"></span>
                        <span class="text-muted mx-1">-</span>
                        <span th:text="${l.albara?.dataProduccio != null ? #temporals.format(l.albara.dataProduccio, 'dd/MM/yyyy') : 'Sin fecha'}"></span>
                    </div>

                </div>
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
