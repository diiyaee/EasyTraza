<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algo ha fallado</title>
    <style>
        /* BASE */
        body { 
            margin: 0; 
            background-color: #efebe9; 
            font-family: 'Segoe UI', Roboto, Arial, sans-serif; 
            /* Flexbox para centrar contenido en toda la pantalla */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* CARDS */
        .card-item { 
            background-color: #fff3e0; 
            color: #3e2723; 
            border-radius: 15px; 
            padding: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
        }

        /* BOTONES */
        .btn-brown { 
            border-radius: 10px; 
            font-weight: 500; 
            padding: 6px 12px; 
            transition: all 0.2s ease; 
            text-decoration: none; 
            display: inline-block; 
        }
        .btn-brown-lg { 
            padding: 10px 18px; 
            font-size: 1rem; 
        }
        .btn-brown-info { 
            background-color: #8d6e63; 
            color: white; 
            border: none; 
        }
        .btn-brown-info:hover { 
            background-color: #795548; 
            color: white; 
        }
        
        /* AJUSTES ESPECÍFICOS PARA LA TARJETA DE ERROR */
        .error-card {
            flex-direction: column;
            text-align: center;
            padding: 50px 30px;
            max-width: 500px;
            width: 90%; /* Para asegurar que no se desborde en móviles */
        }
        .error-icon { font-size: 60px; margin-bottom: 15px; }
        .error-title { font-size: 24px; font-weight: bold; margin-bottom: 10px; color: #3e2723; }
        .error-text { font-size: 16px; margin-bottom: 25px; color: #5c514a; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="card-item error-card">
        <div class="error-icon">🧭</div>
        <div class="error-title">¡Vaya! Ha habido un error</div>
        <div class="error-text">No se ha podido procesar tu solicitud. Puede que la página que buscas no exista, el enlace sea incorrecto o haya ocurrido un error inesperado.</div>
        <a href="/albarans-proveidor" class="btn-brown btn-brown-info btn-brown-lg">Volver a lugar seguro</a>
    </div>

</body>
</html>
