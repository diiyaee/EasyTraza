<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Albarán proveedor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/modStyles.css">
</head>

<body>

<div class="container py-5">

    <h2 class="mb-4">
        <span th:if="${mode == 'create'}">Crear albarán</span>
        <span th:if="${mode == 'edit'}">Editar albarán</span>
    </h2>

    <div class="form-box">

        <!-- MENSAJES -->
        <div th:if="${error}"
             class="alert alert-danger"
             th:text="${error}">
        </div>

        <div class="alert alert-info">
            Puedes rellenar el albarán manualmente o subir una imagen/PDF
            para autocompletarlo mediante OCR + IA.
        </div>

        <!-- OCR -->
        <div class="card p-4 mb-4 shadow-sm">

            <h5 class="mb-3">
                📷 Escanear albarán con OCR
            </h5>

            <form th:action="@{/albarans-proveidor/ocr}"
                  method="post"
                  enctype="multipart/form-data"
                  id="ocrForm">

                <div class="mb-3">

                    <label class="form-label">
                        Imagen o PDF del albarán
                    </label>

                    <input type="file"
                           name="imatge"
                           accept="image/*,.pdf"
                           class="form-control"
                           required>

                    <div class="form-text">
                        Formatos permitidos: JPG, PNG, PDF
                    </div>

                </div>

                <button type="submit"
                        class="btn btn-brown-primary btn-brown-sm">

                    Escanear imagen

                </button>

                <div id="loadingOCR"
                     class="mt-3 text-primary fw-bold"
                     style="display:none;">

                    Procesando OCR e IA...

                </div>

            </form>

        </div>

        <!-- FORMULARIO -->
        <form id="albaraForm"
              th:action="@{/albarans-proveidor/guardar}"
              th:object="${albara}"
              method="post">

            <input type="hidden" th:field="*{id}">

            <!-- NUM ALBARÁN -->
            <div class="mb-3">

                <label class="form-label">
                    Número albarán
                </label>

                <input type="text"
                       class="form-control"
                       th:field="*{numAlbara}"
                       required>

            </div>

            <!-- PROVEEDOR -->
            <div class="mb-3">

                <label class="form-label">
                    Proveedor
                </label>

                <select class="form-control"
                        th:field="*{proveidor.id}"
                        required>

                    <option value="">-- Selecciona --</option>

                    <option th:each="p : ${proveidors}"
                            th:value="${p.id}"
                            th:text="${p.nom}">
                    </option>

                </select>

            </div>

            <!-- FECHA -->
            <div class="mb-3">

                <label class="form-label">
                    Fecha recepción
                </label>

                <input type="date"
                       class="form-control"
                       th:field="*{dataRecepcio}"
                       required>

            </div>

            <hr>

            <div class="d-flex justify-content-between align-items-center mb-3">

                <h5 class="mb-0">
                    Líneas del albarán
                </h5>

                <button type="button"
                        class="btn btn-brown-secondary btn-brown-sm"
                        id="addLiniaBtn">

                    + Añadir línea

                </button>

            </div>

            <!-- LÍNEAS -->
            <div id="liniesContainer">

                <div th:if="${albara.linies != null}"
                     th:each="linia, stat : ${albara.linies}"
                     class="border rounded p-3 mb-3 bg-light">

                    <!-- LOTE -->
                    <label>Número lote</label>

                    <input type="text"
                           class="form-control"
                           th:field="*{linies[__${stat.index}__].lot.numLot}">

                    <!-- CADUCIDAD -->
                    <label class="mt-2">
                        Fecha caducidad (si es nuevo lote)
                    </label>

                    <input type="date"
                           class="form-control"
                           th:field="*{linies[__${stat.index}__].lot.dataCaducitat}"
                           th:attr="min=${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">

                    <!-- MATERIA -->
                    <label class="mt-2">
                        Materia
                    </label>

                    <select class="form-control"
                            th:field="*{linies[__${stat.index}__].lot.materia.id}">

                        <option value="">-- Selecciona --</option>

                        <option th:each="m : ${materies}"
                                th:value="${m.id}"
                                th:text="${m.nom}">
                        </option>

                    </select>

                    <!-- CANTIDAD -->
                    <label class="mt-2">
                        Cantidad
                    </label>

                    <input type="number"
                           step="0.01"
                           class="form-control"
                           th:field="*{linies[__${stat.index}__].quantitat}">

                    <!-- UNIDADES -->
                    <label class="mt-2">
                        Unidad
                    </label>

                    <input type="text"
                           class="form-control"
                           placeholder="kg, L, cajas..."
                           th:field="*{linies[__${stat.index}__].unitats}">

                    <!-- ELIMINAR -->
                    <button type="button"
                            class="btn btn-brown-warning btn-brown-sm mt-3 removeLinia">

                        Eliminar

                    </button>

                </div>

            </div>

            <!-- BOTONES -->
            <div class="mt-4">

                <button type="submit"
                        class="btn btn-brown-primary btn-brown-lg">

                    Guardar

                </button>

                <a href="/albarans-proveidor"
                   class="btn btn-brown-secondary btn-brown-lg ms-2">

                    Cancelar

                </a>

            </div>

        </form>

        <!-- OPTIONS OCULTAS -->
        <select id="materiaOptions" style="display:none;">

            <option value="">-- Selecciona --</option>

            <option th:each="m : ${materies}"
                    th:value="${m.id}"
                    th:text="${m.nom}">
            </option>

        </select>

    </div>

</div>

<script th:src="@{/js/modAlbaraProveidor.js}"></script>

</body>
</html>
