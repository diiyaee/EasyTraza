<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Materia</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS externo -->
    <link rel="stylesheet" href="/css/modStyles.css">
</head>

<body>

<div class="container py-5">

    <h2 class="mb-4">
        <span th:if="${mode == 'create'}">Crear materia</span>
        <span th:if="${mode == 'edit'}">Editar materia</span>
    </h2>

    <div class="form-box">

        <!-- MENSAJE ERROR -->
        <div th:if="${missatge}"
             class="alert alert-danger"
             th:text="${missatge}">
        </div>

        <form th:action="@{/materies/guardar}"
              th:object="${materia}"
              method="post">

            <!-- ID (oculto) -->
            <input type="hidden" th:field="*{id}" />

            <!-- NOMBRE -->
            <div class="mb-3">

                <label class="form-label">
                    Nombre
                </label>

                <input type="text"
                       class="form-control"
                       th:field="*{nom}"
                       required>

            </div>

            <!-- BOTONES -->
            <div class="mt-4">

                <!-- GUARDAR -->
                <button type="submit"
                        class="btn btn-brown-primary btn-brown-lg">

                    Guardar

                </button>

                <!-- CANCELAR -->
                <a href="/materies"
                   class="btn btn-brown-secondary btn-brown-lg ms-2">

                    Cancelar

                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
