<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuari</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/modStyles.css">
</head>

<body>

<div class="container py-5">

    <h2 class="mb-4 fw-semibold">
        <span th:if="${usuari.id == null}">Crear usuario</span>
        <span th:if="${usuari.id != null}">Editar usuario</span>
    </h2>

    <div class="form-box">

        <div th:if="${missatge}"
             class="alert alert-danger"
             th:text="${missatge}">
        </div>

        <form th:action="@{/usuaris/guardar}"
              th:object="${usuari}"
              method="post"
              enctype="multipart/form-data">
            
            <div class="mb-3 d-flex align-items-center gap-3">
                <div th:if="${usuari.id != null}">
                    <img th:if="${usuari.fotoPerfil != null}" th:src="${usuari.fotoPerfil}" alt="Foto" class="rounded-circle border" style="width: 60px; height: 60px; object-fit: cover;">
                    <svg th:unless="${usuari.fotoPerfil != null}" xmlns="http://www.w3.org/2000/svg" width="60" height="60" fill="#8d6e63" class="bi bi-person-circle" viewBox="0 0 16 16">
                        <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                        <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
                    </svg>
                </div>

                <div class="flex-grow-1">
                    <label class="form-label fw-semibold">Foto de perfil</label>
                    <input type="file" name="archivoFoto" class="form-control" accept="image/*">
                    <small class="text-muted">Si no subes nada, se mantendrá tu foto actual o el avatar por defecto.</small>
                </div>
            </div>

            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Nombre
                </label>

                <input type="text"
                       class="form-control"
                       th:field="*{nom}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Apellidos
                </label>

                <input type="text"
                       class="form-control"
                       th:field="*{cognoms}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Email
                </label>

                <input type="email"
                       class="form-control"
                       th:field="*{email}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Contraseña
                </label>
                
                <div class="input-group">
                    <input type="password"
                           class="form-control"
                           id="contrasenyaNueva"
                           th:field="*{contrasenya}"
                           th:attr="required=${usuari.id == null}"
                           placeholder="Solo obligatoria al crear o si quieres cambiarla">
                           
                    <button class="btn btn-outline-secondary" type="button" id="btnTogglePassword">
                        <svg id="iconoOjo" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                            <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold d-block mb-2">
                    Tipo de usuario
                </label>

                <div class="form-check mb-2">
                    <input class="form-check-input"
                           type="radio"
                           th:field="*{esAdmin}"
                           value="false">

                    <label class="form-check-label">
                        Usuario común
                    </label>
                </div>

                <div class="form-check">
                    <input class="form-check-input"
                           type="radio"
                           th:field="*{esAdmin}"
                           value="true">

                    <label class="form-check-label">
                        Administrador/a
                    </label>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit"
                        class="btn btn-brown-primary btn-brown-lg">
                    Guardar
                </button>

                <a href="/usuaris"
                   class="btn btn-brown-warning btn-brown-lg">
                    Cancelar
                </a>
            </div>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/contrasenya.js"></script>

</body>
</html>
