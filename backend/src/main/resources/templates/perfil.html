<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div th:replace="layout/sidebar :: sidebar"></div>

<div class="content">
    <h2 class="mb-4">Editar Mi Perfil</h2>

    <div th:if="${ok}" class="alert alert-success" th:text="${ok}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card-item p-4" style="max-width: 600px;">
        <form th:action="@{/perfil/guardar}" th:object="${perfilDTO}" method="post" enctype="multipart/form-data">
            
            <div class="mb-4 d-flex align-items-center gap-3">
                <div>
                    <img th:if="${perfilDTO.fotoPerfil != null}" th:src="${perfilDTO.fotoPerfil}" alt="Foto" class="rounded-circle border" style="width: 70px; height: 70px; object-fit: cover;">
                    <svg th:unless="${perfilDTO.fotoPerfil != null}" xmlns="http://www.w3.org/2000/svg" width="70" height="70" fill="#8d6e63" class="bi bi-person-circle" viewBox="0 0 16 16">
                        <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                        <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
                    </svg>
                </div>
                <div class="flex-grow-1">
                    <label class="form-label fw-bold">Foto de perfil</label>
                    <input type="file" name="archivoFoto" class="form-control" accept="image/*">
                    <div class="text-muted small mt-1">Si no subes nada, se mantendrá tu foto actual o el avatar por defecto.</div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Nombre</label>
                <input type="text" class="form-control" th:field="*{nom}">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Apellidos</label>
                <input type="text" class="form-control" th:field="*{cognoms}">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('cognoms')}" th:errors="*{cognoms}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Correo Electrónico</label>
                <input type="email" class="form-control" th:field="*{email}">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <hr class="my-4">

            <div class="mb-4">
                <label class="form-label fw-bold">Nueva Contraseña</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="contrasenyaNueva" th:field="*{contrasenyaNueva}" placeholder="Déjalo en blanco para mantener la actual">
                    
                    <button class="btn btn-outline-secondary" type="button" id="btnTogglePassword">
                        <svg id="iconoOjo" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                            <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
                        </svg>
                    </button>
                </div>
                <div class="text-muted small mt-1">Si no quieres cambiar tu contraseña, no escribas nada aquí.</div>
            </div>

            <button type="submit" class="btn-brown btn-brown-primary w-100 py-2">
                Guardar Cambios
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/contrasenya.js"></script>
</body>
</html>
