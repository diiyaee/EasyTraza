<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Albarán cliente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/modStyles.css">
</head>

<body>

<div class="container py-5">

    <h2 class="mb-4">
        <span th:if="${mode == 'create'}">Crear albarán cliente</span>
        <span th:if="${mode == 'edit'}">Editar albarán cliente</span>
    </h2>

    <div class="form-box">

        <!-- ERROR -->
        <div th:if="${error}"
             class="alert alert-danger"
             th:text="${error}">
        </div>

        <!-- FORMULARIO -->
        <form id="albaraForm"
              th:action="@{/albarans-client/guardar}"
              th:object="${albara}"
              method="post">

            <input type="hidden" th:field="*{id}">

            <!-- CLIENTE -->
            <div class="mb-3">

                <label class="form-label">
                    Cliente
                </label>

                <select class="form-control"
                        th:field="*{client.id}"
                        required>

                    <option value="">-- Selecciona --</option>

                    <option th:each="c : ${clients}"
                            th:value="${c.id}"
                            th:text="${c.nom}">
                    </option>

                </select>

            </div>

            <!-- FECHA -->
            <div class="mb-3">

                <label class="form-label">
                    Fecha producción
                </label>

                <input type="date"
                       class="form-control"
                       th:field="*{dataProduccio}"
                       required>

            </div>

            <hr>

            <!-- CABECERA LÍNEAS -->
            <div class="d-flex justify-content-between align-items-center mb-3">

                <h5 class="mb-0">
                    Líneas del albarán
                </h5>

                <button type="button"
                        class="btn btn-brown-secondary btn-brown-sm"
                        id="addLiniaBtn">

                    + Añadir línea

                </button>

            </div>

            <!-- LÍNEAS -->
            <div id="liniesContainer">

                <div th:each="linia, stat : ${albara.linies}"
                     class="border rounded p-3 mb-3 bg-light">

                    <!-- PRODUCTO -->
                    <label class="form-label">
                        Producto
                    </label>

                    <select class="form-control"
                            th:field="*{linies[__${stat.index}__].producte.id}">

                        <option value="">-- Selecciona --</option>

                        <option th:each="p : ${productes}"
                                th:value="${p.id}"
                                th:text="${p.nom}">
                        </option>

                    </select>

                    <!-- CANTIDAD -->
                    <label class="form-label mt-2">
                        Cantidad
                    </label>

                    <input type="number"
                           step="0.01"
                           class="form-control"
                           th:field="*{linies[__${stat.index}__].quantitat}">

                    <!-- ELIMINAR -->
                    <button type="button"
                            class="btn btn-brown-warning btn-brown-sm mt-3 removeLinia">

                        Eliminar

                    </button>

                </div>

            </div>

            <!-- BOTONES -->
            <div class="mt-4">

                <button type="submit"
                        class="btn btn-brown-primary btn-brown-lg">

                    Guardar

                </button>

                <a href="/albarans-client"
                   class="btn btn-brown-secondary btn-brown-lg ms-2">

                    Cancelar

                </a>

            </div>

        </form>

        <!-- OPTIONS OCULTAS -->
        <select id="producteOptions" style="display:none;">

            <option value="">-- Selecciona --</option>

            <option th:each="p : ${productes}"
                    th:value="${p.id}"
                    th:text="${p.nom}">
            </option>

        </select>

    </div>

</div>

<script th:src="@{/js/modAlbaraClient.js}"></script>

</body>
</html>
