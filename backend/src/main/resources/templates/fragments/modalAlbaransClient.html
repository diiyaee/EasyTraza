<div th:fragment="modalAlbaransClient">

    <div class="modal fade" id="deleteAlbaraModal" tabindex="-1">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Confirmar eliminación
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <p id="modalAlbaraText">
                        ¿Seguro que quieres eliminar este albarán?
                    </p>

                </div>

                <div class="modal-footer">

                    <button type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                        Cancelar
                    </button>

                    <button type="button"
                            class="btn btn-danger"
                            id="confirmDeleteAlbara">

                        Eliminar
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>
