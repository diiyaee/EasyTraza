<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Gráfico mensual</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div th:replace="layout/sidebar :: sidebar"></div>

<div class="content">

    <h2 class="mb-4">Gráfico mensual de productos vendidos</h2>

    <div class="card-item mb-4">

        <div class="row g-3 w-100">

            <div class="col-md-6 col-lg-4">
                <label class="form-label">Mes</label>
                <select id="mesSelect" class="form-select"></select>
            </div>

            <div class="col-md-6 col-lg-4">
                <label class="form-label">Producto</label>
                <select id="producteSelect" class="form-select">
                    <option value="">Todos los productos</option>
                </select>
            </div>

        </div>

    </div>

    <div class="card-item mb-4 d-flex justify-content-between align-items-center">

        <h5 class="mb-0">Total mensual</h5>

        <span class="badge"
              style="background-color:#8d6e63; color:white; padding:8px 12px; border-radius:10px;">
            <span id="totalMes">0</span> unidades
        </span>

    </div>

    <div class="card-item">
        <canvas id="grafico" height="100"></canvas>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let chart;

    const mesSelect = document.getElementById("mesSelect");
    const producteSelect = document.getElementById("producteSelect");

    function cargarMeses() {
        const now = new Date();

        for (let i = 0; i < 12; i++) {
            const d = new Date(now.getFullYear(), now.getMonth() - i, 1);

            const year = d.getFullYear();
            const month = d.getMonth() + 1;

            const value = `${year}-${month.toString().padStart(2, '0')}`;
            const label = d.toLocaleDateString('es-ES', {
                month: 'long',
                year: 'numeric'
            });

            const option = document.createElement("option");
            option.value = value;
            option.textContent = label;

            mesSelect.appendChild(option);
        }

        mesSelect.value = mesSelect.options[0].value;
    }

    function cargarProductos() {
        fetch("/api/productes")
            .then(r => r.json())
            .then(data => {
                data.forEach(p => {
                    const option = document.createElement("option");
                    option.value = p.id;
                    option.textContent = p.nom;
                    producteSelect.appendChild(option);
                });
            })
            .catch(() => console.warn("No se pudieron cargar productos"));
    }

    function cargarGrafico() {

        const [any, mes] = mesSelect.value.split("-");
        const producteId = producteSelect.value || "";

        fetch(`/grafic-mensual/data?any=${any}&mes=${mes}&producteId=${producteId}`)
            .then(res => res.json())
            .then(data => {

                const labels = data.datos.map(d => d.dia);
                const values = data.datos.map(d => d.cantidad);

                document.getElementById("totalMes").textContent = data.totalMes;

                if (chart) chart.destroy();

                const ctx = document.getElementById("grafico").getContext("2d");

                chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [{
                        label: 'Unidades vendidas',
                        data: values,
                        borderWidth: 3,
                        tension: 0.35,
                        fill: true,
                        borderColor: '#6d4c41',      // marrón principal
                        backgroundColor: 'rgba(109, 76, 65, 0.15)', // relleno suave
                        pointBackgroundColor: '#6d4c41',
                        pointBorderColor: '#6d4c41'
                    }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                display: false
                            }
                        },
                        scales: {
                            x: {
                                title: {
                                    display: true,
                                    text: 'Días del mes',
                                    font: {
                                        weight: 'bold'
                                    }
                                }
                            },
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'Cantidad de productos vendidos',
                                    font: {
                                        weight: 'bold'
                                    }
                                }
                            }
                        }
                    }
                });

            });
    }

    mesSelect.addEventListener("change", cargarGrafico);
    producteSelect.addEventListener("change", cargarGrafico);

    cargarMeses();
    cargarProductos();
    cargarGrafico();
</script>

</body>
</html>
