<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clients</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<!-- SIDEBAR -->
<div th:replace="layout/sidebar :: sidebar"></div>

<!-- CONTENT -->
<div class="content">

    <h2 class="mb-4">Lista de clientes</h2>

    <div th:if="${missatge}" class="alert alert-danger" th:text="${missatge}"></div>
    
    <form method="get" id="filterForm" class="mb-4 p-3 rounded shadow-sm" style="background-color: #efebe9; border: 1px solid #d7b899;">
        <div class="row g-2 align-items-end mb-3">
            <div class="col-md-3 col-sm-6">
                <label class="form-label text-muted small fw-bold mb-1">Nombre</label>
                <input type="text" name="nomCognoms" class="form-control form-control-sm" th:value="${param.nomCognoms}" placeholder="Nombre...">
            </div>
            <div class="col-md-2 col-sm-6">
                <label class="form-label text-muted small fw-bold mb-1">NIF</label>
                <input type="text" name="nif" class="form-control form-control-sm" th:value="${param.nif}" placeholder="NIF...">
            </div>
            <div class="col-md-2 col-sm-6">
                <label class="form-label text-muted small fw-bold mb-1">Teléfono</label>
                <input type="text" name="telefon" class="form-control form-control-sm" th:value="${param.telefon}" placeholder="Número de teléfono...">
            </div>
            <div class="col-md-3 col-sm-6">
                <label class="form-label text-muted small fw-bold mb-1">Dirección</label>
                <input type="text" name="adreca" class="form-control form-control-sm" th:value="${param.adreca}" placeholder="Dirección...">
            </div>

            <div class="col-md-2 col-sm-12 d-flex gap-2">
                <button type="submit" class="btn btn-brown-primary btn-brown-sm flex-grow-1">Filtrar</button>
                <a href="/clients" class="btn btn-brown-warning btn-brown-sm flex-grow-1">Limpiar</a>
            </div>
        </div>

        <hr style="border-color: #d7b899; opacity: 0.5;" class="m-0 mb-2">

        <div class="d-flex justify-content-end align-items-center gap-2 mt-2">
            <label class="text-muted small fw-bold mb-0">Ordenar por:</label>
            <div class="input-group input-group-sm w-auto shadow-sm">
                <select name="sortField" class="form-select" onchange="document.getElementById('filterForm').submit()" style="border-color: #d7b899; min-width: 130px;">
                    <option value="nom" th:selected="${sortField == 'nom'}">Nombre</option>
                    <option value="nif" th:selected="${sortField == 'nif'}">NIF</option>
                    <option value="telefon" th:selected="${sortField == 'telefon'}">Teléfono</option>
                    <option value="adreca" th:selected="${sortField == 'adreca'}">Dirección</option>
                </select>

                <input type="hidden" name="asc" id="ascInput" th:value="${asc}">

                <button class="btn" style="background-color: #8d6e63; color: white; border-color: #8d6e63;" type="button" onclick="toggleAsc()">
                    <span th:text="${asc ? '⬆️ Asc' : '⬇️ Desc'}"></span>
                </button>
            </div>
        </div>
    </form>

    <script>
        function toggleAsc() {
            const ascInput = document.getElementById('ascInput');
            ascInput.value = ascInput.value === 'true' ? 'false' : 'true';
            document.getElementById('filterForm').submit();
        }
    </script>

    <!-- LISTA -->
    <div th:each="c : ${clients}" class="card-item">

        <div>
            <h5 class="mb-1" th:text="${c.nom + ' ' + c.cognoms}"></h5>

            <small class="text-muted d-block">
                NIF: <span th:text="${c.nif}"></span>
            </small>

            <small class="text-muted d-block">
                Tel: <span th:text="${c.telefon}"></span>
            </small>

            <small class="text-muted d-block" th:text="${c.adreca}"></small>

            <div class="text-muted small mt-1"
                 th:if="${c.observacions != null}">
                Obs: <span th:text="${c.observacions}"></span>
            </div>
        </div>

        <!-- BOTONES -->
        <div class="d-flex align-items-center gap-2">

            <!-- EDITAR -->
            <a th:href="@{'/clients/modClient/' + ${c.id}}"
               class="btn btn-brown-warning btn-brown-sm">
                Editar
            </a>

            <!-- ELIMINAR -->
            <button type="button" 
                    class="btn btn-brown-primary btn-brown-sm btn-delete-client" 
                    data-bs-toggle="modal" 
                    data-bs-target="#deleteClientModal" 
                    th:attr="data-id=${c.id}, data-nom=${c.nom}">
                Eliminar
            </button>

        </div>

    </div>

    <!-- CREAR -->
    <a href="/clients/nouClient"
       class="btn btn-brown-primary btn-brown-lg mt-3">
        + Crear cliente
    </a>

</div>

<!-- MODAL -->
<div th:replace="fragments/modalClients :: modalClients"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/clients.js"></script>

</body>
</html>
