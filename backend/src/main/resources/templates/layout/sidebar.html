<div th:fragment="sidebar" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="sidebar d-flex flex-column">
        
        <div class="user-profile-section p-3 mb-3 d-flex align-items-center gap-3"
             style="background-color: rgba(0, 0, 0, 0.15); border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
            
            <div style="flex-shrink: 0;">
                <img th:if="${#authentication.principal.usuari.fotoPerfil != null}" 
                     th:src="${#authentication.principal.usuari.fotoPerfil}" 
                     alt="Mi Perfil" 
                     class="rounded-circle shadow-sm"
                     style="width: 45px; height: 45px; object-fit: cover; border: 2px solid rgba(255,255,255,0.8);">
                     
                <svg th:unless="${#authentication.principal.usuari.fotoPerfil != null}" 
                     xmlns="http://www.w3.org/2000/svg" 
                     width="45" height="45" 
                     fill="rgba(255, 255, 255, 0.8)" 
                     class="bi bi-person-circle" 
                     viewBox="0 0 16 16">
                    <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                    <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
                </svg>
            </div>
            
            <div class="text-white overflow-hidden">
                <small class="d-block text-uppercase fw-bold" style="font-size: 0.65rem; letter-spacing: 0.5px; opacity: 0.7;">
                    Sesión actual
                </small>
                <div class="fw-semibold text-truncate" style="font-size: 0.95rem;" 
                     th:text="${#authentication.principal.usuari.nom + ' ' + #authentication.principal.usuari.cognoms}">
                </div>
            </div>
        </div>

        <a href="/proveidors" sec:authorize="hasRole('ADMIN')">Proveedores</a>
        <a href="/albarans-proveidor">Albaranes de proveedores</a>
        <a href="/lots">Lotes</a>
        <a href="/clients" sec:authorize="hasRole('ADMIN')">Clientes</a>
        <a href="/albarans-client">Albaranes de clientes</a>
        <a href="/materies" sec:authorize="hasRole('ADMIN')">Materias primas</a>
        <a href="/productes" sec:authorize="hasRole('ADMIN')">Productos</a>
        <a href="/usuaris" sec:authorize="hasRole('ADMIN')">Usuarios</a>
        <a href="/grafic-mensual">Gráfico mensual de productos vendidos</a>
        <a href="/perfil">Editar mi Perfil</a>

        <form th:action="@{/logout}" method="post" class="mt-auto w-100" style="margin: 0; padding: 0;">
            <button type="submit" class="w-100 py-3 d-flex justify-content-center align-items-center transition-all" 
                    style="background-color: #c63927; color: white; font-weight: 600; border: none; border-radius: 0; cursor: pointer;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-box-arrow-left me-2" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M6 12.5a.5.5 0 0 0 .5.5h8a.5.5 0 0 0 .5-.5v-9a.5.5 0 0 0-.5-.5h-8a.5.5 0 0 0-.5.5v2a.5.5 0 0 1-1 0v-2A1.5 1.5 0 0 1 6.5 2h8A1.5 1.5 0 0 1 16 3.5v9a1.5 1.5 0 0 1-1.5 1.5h-8A1.5 1.5 0 0 1 5 12.5v-2a.5.5 0 0 1 1 0v2z"/>
                    <path fill-rule="evenodd" d="M.146 8.354a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L1.707 7.5H10.5a.5.5 0 0 1 0 1H1.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3z"/>
                </svg>
                Cerrar sesión
            </button>
        </form>
    </div>
</div>
