<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyTraza - Nueva Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #efebe9; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .container-box { width: 100%; max-width: 500px; background-color: #fff3e0; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); padding: 40px; color: #3e2723; }
        .header-gradient { background: linear-gradient(135deg, #4e342e, #8d6e63); color: white; margin: -40px -40px 30px -40px; padding: 25px; text-align: center; border-top-left-radius: 15px; border-top-right-radius: 15px; }
        .form-input-brown { border: 1px solid #d7b899; border-radius: 10px; padding: 12px; color: #3e2723; }
        .form-input-brown:focus { outline: none; border-color: #8d6e63; box-shadow: 0 0 5px rgba(141, 110, 99, 0.4); }
        .btn-brown-primary { background-color: #6d4c41; color: white; border: none; border-radius: 10px; font-weight: 600; }
        .btn-brown-primary:hover { background-color: #4e342e; color: white; }
        .input-group .form-input-brown { border-top-right-radius: 0; border-bottom-right-radius: 0; }
        .input-group .btn-outline-secondary { border-color: #d7b899; border-top-right-radius: 10px; border-bottom-right-radius: 10px; color: #3e2723; }
    </style>
</head>
<body>
    <div class="container-box">
        <div class="header-gradient">
            <h3 class="m-0 fw-bold">EasyTraza</h3>
            <small>Establecer nueva contraseña</small>
        </div>

        <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>

        <form th:action="@{/recuperar-password/cambiar}" method="post">
            <input type="hidden" name="token" th:value="${token}">

            <div class="mb-4">
                <label for="contrasenyaNueva" class="form-label fw-bold">Nueva contraseña</label>
                <div class="input-group">
                    <input type="password" id="contrasenyaNueva" name="password" class="form-control form-input-brown" placeholder="Mínimo 6 caracteres" required autofocus>
                    <button class="btn btn-outline-secondary" type="button" id="btnTogglePassword">
                        <svg id="iconoOjo" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                            <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-brown-primary w-100 py-2">Actualizar contraseña</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/perfil.js"></script>
</body>
</html>
