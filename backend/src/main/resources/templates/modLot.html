<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lote</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS externo -->
    <link rel="stylesheet" href="/css/modStyles.css">
</head>

<body>

<div class="container py-5">

    <h2 class="mb-4">
        <span th:if="${mode == 'create'}">Crear lote</span>
        <span th:if="${mode == 'edit'}">Editar lote</span>
    </h2>

    <div class="form-box">

        <!-- ERROR -->
        <div th:if="${missatge}"
             class="alert alert-danger"
             th:text="${missatge}">
        </div>

        <form th:action="@{/lots/guardar}"
              th:object="${lot}"
              method="post">

            <!-- ID -->
            <input type="hidden" th:field="*{id}" />

            <!-- NUMERO LOTE -->
            <div class="mb-3">

                <label class="form-label">
                    Número de lote
                </label>

                <input type="text"
                       class="form-control"
                       th:field="*{numLot}"
                       required>

            </div>

            <!-- MATERIA -->
            <div class="mb-3">

                <label class="form-label">
                    Materia
                </label>

                <select class="form-select"
                        th:field="*{materia}"
                        required>

                    <option value="" disabled>
                        Selecciona materia
                    </option>

                    <option th:each="m : ${materies}"
                            th:value="${m.id}"
                            th:text="${m.nom}"
                            th:selected="${lot.materia != null and m.id == lot.materia.id}">
                    </option>

                </select>

            </div>

            <!-- PROVEEDOR -->
            <div class="mb-3">

                <label class="form-label">
                    Proveedor
                </label>

                <select class="form-select"
                        th:field="*{proveidor}"
                        required>

                    <option value="" disabled>
                        Selecciona proveedor
                    </option>

                    <option th:each="p : ${proveidors}"
                            th:value="${p.id}"
                            th:text="${p.nom}"
                            th:selected="${lot.proveidor != null and p.id == lot.proveidor.id}">
                    </option>

                </select>

            </div>

            <!-- FECHA CADUCIDAD -->
            <div class="mb-3">

                <label class="form-label">
                    Fecha de caducidad
                </label>

                <input type="date"
                       class="form-control"
                       th:field="*{dataCaducitat}"
                       required>

            </div>

            <!-- BOTONES -->
            <div class="mt-4">

                <!-- GUARDAR -->
                <button type="submit"
                        class="btn btn-brown-primary btn-brown-lg">

                    Guardar

                </button>

                <!-- CANCELAR -->
                <a href="/lots"
                   class="btn btn-brown-secondary btn-brown-lg ms-2">

                    Cancelar

                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
