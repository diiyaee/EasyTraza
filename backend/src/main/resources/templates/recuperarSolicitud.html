<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyTraza - Recuperar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #efebe9; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; margin: 0; }
        .container-box { width: 100%; max-width: 500px; background-color: #fff3e0; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); padding: 40px; color: #3e2723; }
        .header-gradient { background: linear-gradient(135deg, #4e342e, #8d6e63); color: white; margin: -40px -40px 30px -40px; padding: 25px; text-align: center; border-top-left-radius: 15px; border-top-right-radius: 15px; }
        .form-input-brown { border: 1px solid #d7b899; border-radius: 10px; padding: 12px; color: #3e2723; }
        .form-input-brown:focus { outline: none; border-color: #8d6e63; box-shadow: 0 0 5px rgba(141, 110, 99, 0.4); }
        .btn-brown-primary { background-color: #6d4c41; color: white; border: none; border-radius: 10px; font-weight: 600; }
        .btn-brown-primary:hover { background-color: #4e342e; color: white; }
    </style>
</head>
<body>
    <div class="container-box">
        <div class="header-gradient">
            <h3 class="m-0 fw-bold">EasyTraza</h3>
            <small>Restablecer contraseña</small>
        </div>

        <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>
        <div th:if="${errorToken}" class="alert alert-danger text-center" th:text="${errorToken}"></div>
        <div th:if="${ok}" class="alert alert-success text-center" th:text="${ok}"></div>

        <div th:if="${ok == null}">
            <p class="mb-4 text-muted small">Introduce tu correo electrónico y te enviaremos un enlace seguro para que puedas cambiar tu contraseña.</p>
            <form th:action="@{/recuperar-password}" method="post">
                <div class="mb-4">
                    <label class="form-label fw-bold">Correo electrónico</label>
                    <input type="email" name="email" class="form-control form-input-brown" placeholder="ejemplo@easytraza.com" required autofocus>
                </div>
                <button type="submit" class="btn btn-brown-primary w-100 py-2 mb-3">Enviar enlace de recuperación</button>
            </form>
        </div>
        <div class="text-center mt-2">
            <a href="/login" class="text-decoration-none small" style="color: #8d6e63; font-weight: 600;">← Volver al inicio de sesión</a>
        </div>
    </div>
</body>
</html>
