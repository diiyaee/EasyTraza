<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Producto</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS externo -->
    <link rel="stylesheet" href="/css/modStyles.css">
</head>

<body>

<div class="container py-5">

    <h2 class="mb-4 fw-semibold">
        <span th:if="${mode == 'create'}">Crear producto</span>
        <span th:if="${mode == 'edit'}">Editar producto</span>
    </h2>

    <div class="form-box">

        <!-- MENSAJE ERROR -->
        <div th:if="${missatge}"
             class="alert alert-danger"
             th:text="${missatge}">
        </div>

        <form th:action="@{/productes/guardar}"
              th:object="${producte}"
              method="post">

            <!-- ID oculto -->
            <input type="hidden" th:field="*{id}" />

            <!-- NOMBRE -->
            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Nombre
                </label>

                <input type="text"
                       class="form-control"
                       th:field="*{nom}"
                       required>
            </div>

            <!-- DESCRIPCIÓN -->
            <div class="mb-4">
                <label class="form-label fw-semibold">
                    Descripción
                </label>

                <textarea class="form-control"
                          rows="4"
                          th:field="*{descripcio}">
                </textarea>
            </div>

            <!-- BOTONES -->
            <div class="d-flex gap-2">

                <button type="submit"
                        class="btn btn-brown-primary btn-brown-lg">

                    Guardar

                </button>

                <a href="/productes"
                   class="btn btn-brown-warning btn-brown-lg">

                    Cancelar

                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
