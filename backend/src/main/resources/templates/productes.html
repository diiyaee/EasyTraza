<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<!-- SIDEBAR -->
<div th:replace="layout/sidebar :: sidebar"></div>

<!-- CONTENT -->
<div class="content">

    <h2 class="mb-4">Lista de productos</h2>

    <!-- ERROR -->
    <div th:if="${missatge}" class="alert alert-danger" th:text="${missatge}"></div>
    
    <form method="get" id="filterForm" class="mb-4 p-3 rounded shadow-sm" style="background-color: #efebe9; border: 1px solid #d7b899;">
        <div class="row g-2 align-items-end mb-3">
            <div class="col-md-4 col-sm-6">
                <label class="form-label text-muted small fw-bold mb-1">Nombre de producto</label>
                <input type="text" name="nom" class="form-control form-control-sm" th:value="${param.nom}" placeholder="Nombre de producto...">
            </div>

            <div class="col-md-2 col-sm-12 d-flex gap-2">
                <button type="submit" class="btn btn-brown-primary btn-brown-sm flex-grow-1">Filtrar</button>
                <a href="/productes" class="btn btn-brown-warning btn-brown-sm flex-grow-1">Limpiar</a>
            </div>
        </div>

        <hr style="border-color: #d7b899; opacity: 0.5;" class="m-0 mb-2">

        <div class="d-flex justify-content-end align-items-center gap-2 mt-2">
            <label class="text-muted small fw-bold mb-0">Ordenar por Nombre:</label>

            <div class="input-group input-group-sm w-auto shadow-sm">
                <input type="hidden" name="sortField" value="nom">
                <input type="hidden" name="asc" id="ascInput" th:value="${asc}">

                <button class="btn" 
                        style="background-color: #8d6e63; color: white; border-color: #8d6e63;" 
                        type="button" 
                        onclick="toggleAsc()">
                    <span th:text="${asc ? '⬆️ Asc' : '⬇️ Desc'}"></span>
                </button>
            </div>
        </div>
    </form>

    <script>
        function toggleAsc() {
            const ascInput = document.getElementById('ascInput');
            ascInput.value = ascInput.value === 'true' ? 'false' : 'true';
            document.getElementById('filterForm').submit();
        }
    </script>

    <!-- LISTA -->
    <div th:each="p : ${productes}" class="card-item d-flex justify-content-between align-items-center">

        <div>
            <h5 class="mb-0" th:text="${p.nom}"></h5>

            <div class="info text-muted" th:if="${p.descripcio != null}">
                <span th:text="${p.descripcio}"></span>
            </div>
        </div>

        <!-- BOTONES -->
        <div class="d-flex align-items-center gap-2">

            <!-- EDITAR (consistente con proveedores) -->
            <a th:href="@{'/productes/modProducte/' + ${p.id}}"
               class="btn btn-brown-warning btn-brown-sm">
                Editar
            </a>

            <!-- ELIMINAR (acción principal peligrosa, como proveedores) -->
            <button type="button"
                    class="btn btn-brown-primary btn-brown-sm btn-delete-product"
                    data-bs-toggle="modal"
                    data-bs-target="#deleteProductModal"
                    th:attr="data-id=${p.id}, data-nom=${p.nom}">
                Eliminar
            </button>

        </div>

    </div>

    <!-- CREAR -->
    <a href="/productes/nouProducte"
       class="btn btn-brown-primary btn-brown-lg mt-3">
        + Crear producto
    </a>

</div>

<!-- FORM OCULTO -->
<form id="deleteProductForm" method="post"></form>

<!-- MODAL -->
<div th:replace="fragments/modalProductes :: modalProductes"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/productes.js"></script>

</body>
</html>
