<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Proveedor</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS externo -->
    <link rel="stylesheet" href="/css/modStyles.css">
</head>

<body>

<div class="container py-5">

    <h2 class="mb-4">
        <span th:if="${mode == 'create'}">Crear proveedor</span>
        <span th:if="${mode == 'edit'}">Editar proveedor</span>
    </h2>

    <div class="form-box">

        <!-- MENSAJE ERROR -->
        <div th:if="${missatge}"
             class="alert alert-danger"
             th:text="${missatge}">
        </div>

        <form th:action="@{/proveidors/guardar}"
              th:object="${proveidor}"
              method="post">

            <!-- ID OCULTO -->
            <input type="hidden" th:field="*{id}">

            <!-- NIF -->
            <div class="mb-3">

                <label class="form-label">
                    NIF
                </label>

                <input type="text"
                       class="form-control"
                       th:field="*{nif}"
                       th:readonly="${mode == 'edit'}"
                       required>

            </div>

            <!-- NOMBRE -->
            <div class="mb-3">

                <label class="form-label">
                    Nombre
                </label>

                <input type="text"
                       class="form-control"
                       th:field="*{nom}"
                       required>

            </div>

            <!-- TELÉFONO -->
            <div class="mb-3">

                <label class="form-label">
                    Teléfono
                </label>

                <input type="text"
                       class="form-control"
                       th:field="*{telefon}"
                       required>

            </div>

            <!-- DIRECCIÓN -->
            <div class="mb-3">

                <label class="form-label">
                    Dirección
                </label>

                <input type="text"
                       class="form-control"
                       th:field="*{adreca}"
                       required>

            </div>

            <!-- OBSERVACIONES -->
            <div class="mb-3">

                <label class="form-label">
                    Observaciones
                </label>

                <textarea class="form-control"
                          rows="4"
                          th:field="*{observacions}">
                </textarea>

            </div>

            <!-- BOTONES -->
            <div class="mt-4">

                <!-- GUARDAR -->
                <button type="submit"
                        class="btn btn-brown-primary btn-brown-lg">

                    Guardar

                </button>

                <!-- CANCELAR -->
                <a href="/proveidors"
                   class="btn btn-brown-secondary btn-brown-lg ms-2">

                    Cancelar

                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
