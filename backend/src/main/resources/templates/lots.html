<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lotes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<div th:replace="~{layout/sidebar :: sidebar}"></div>

<div class="content">

    <h2 class="mb-4">Lista de lotes</h2>

    <div th:if="${missatge}" class="alert alert-danger" th:text="${missatge}"></div>

    <form method="get" id="filterForm" class="mb-4 p-3 rounded shadow-sm" style="background-color: #efebe9; border: 1px solid #d7b899;">
        
        <div class="row g-2 align-items-end mb-3">
            
            <div class="col-md-2 col-sm-6">
                <label class="form-label text-muted small fw-bold mb-1">Número de lote</label>
                <input type="text" name="numLot" class="form-control form-control-sm" th:value="${param.numLot}" placeholder="Numero de lote...">
            </div>

            <div class="col-md-2 col-sm-6">
                <label class="form-label text-muted small fw-bold mb-1">Estado</label>
                <select name="estatLot" class="form-select form-select-sm">
                    <option value="">Todos</option>
                    <option th:each="e : ${T(cat.copernic.backend.enums.EstatLot).values()}"
                            th:value="${e}"
                            th:selected="${e.name() == param.estatLot?.toString()}"
                            th:text="${e == T(cat.copernic.backend.enums.EstatLot).EN_ESTOC ? 'En stock' : 
                                      (e == T(cat.copernic.backend.enums.EstatLot).OBERT ? 'Abierto' : 'Finalizado')}">
                    </option>
                </select>
            </div>

            <div class="col-md-3 col-sm-6">
                <label class="form-label text-muted small fw-bold mb-1">Materia</label>
                <select name="materiaId" class="form-select form-select-sm">
                    <option value="">Todas</option>
                    <option th:each="m : ${materies}"
                            th:value="${m.id}"
                            th:text="${m.nom}"
                            th:selected="${m.id.toString() == param.materiaId?.toString()}">
                    </option>
                </select>
            </div>

            <div class="col-md-3 col-sm-6">
                <label class="form-label text-muted small fw-bold mb-1">Caduca antes de</label>
                <input type="date" name="dataCaducitat" class="form-control form-control-sm" th:value="${param.dataCaducitat}">
            </div>
            
            <div class="col-md-2 col-sm-12 d-flex gap-2">
                <button type="submit" class="btn btn-brown-primary btn-brown-sm flex-grow-1">Filtrar</button>
                <a href="/lots" class="btn btn-brown-warning btn-brown-sm flex-grow-1">Limpiar</a>
            </div>
        </div>

        <hr style="border-color: #d7b899; opacity: 0.5;" class="m-0 mb-2">

        <div class="d-flex justify-content-end align-items-center gap-2 mt-2">
            <label class="text-muted small fw-bold mb-0">Ordenar por:</label>
            <div class="input-group input-group-sm w-auto shadow-sm">
                <select name="sortField" class="form-select" onchange="document.getElementById('filterForm').submit()" style="border-color: #d7b899; min-width: 130px;">
                    <option value="dataCaducitat" th:selected="${sortField == 'dataCaducitat'}">Caducidad</option>
                    <option value="numLot" th:selected="${sortField == 'numLot'}">Nº Lote</option>
                    <option value="materia" th:selected="${sortField == 'materia'}">Materia</option>
                </select>
                
                <input type="hidden" name="asc" id="ascInput" th:value="${asc}">
                
                <button class="btn" style="background-color: #8d6e63; color: white; border-color: #8d6e63;" type="button" onclick="toggleAsc()">
                    <span th:text="${asc ? '⬆️ Asc' : '⬇️ Desc'}"></span>
                </button>
            </div>
        </div>

    </form>
    
    <script>
        function toggleAsc() {
            const ascInput = document.getElementById('ascInput');
            ascInput.value = ascInput.value === 'true' ? 'false' : 'true';
            document.getElementById('filterForm').submit();
        }
    </script>

    <div th:each="l : ${lots}" class="card-item">

        <div>
            <h5 class="mb-1" th:text="${l.numLot}"></h5>

            <small class="text-muted"
                   th:text="${l.materia.nom + ' · ' + l.proveidor.nom}">
            </small>

            <small class="text-muted d-block">
                Caducidad:
                <span th:text="${#temporals.format(l.dataCaducitat, 'dd/MM/yyyy')}"></span>
            </small>

            <br>

            <span class="badge"
                  th:classappend="${l.estatLot == T(cat.copernic.backend.enums.EstatLot).EN_ESTOC} ? ' bg-success' :
                                 (${l.estatLot == T(cat.copernic.backend.enums.EstatLot).OBERT} ? ' bg-warning' : ' bg-dark')"
                  th:text="${l.estatLot == T(cat.copernic.backend.enums.EstatLot).EN_ESTOC} ? 'En stock' :
                           (${l.estatLot == T(cat.copernic.backend.enums.EstatLot).OBERT} ? 'Abierto' : 'Acabado')">
            </span>
        </div>

        <div class="d-flex align-items-center gap-2">

            <form th:action="@{'/lots/canviar-estat/' + ${l.id}}"
                  method="post"
                  th:if="${l.estatLot != T(cat.copernic.backend.enums.EstatLot).ACABAT}">

                <button type="submit"
                        class="btn btn-brown-primary btn-brown-sm">
                    <span th:text="${l.estatLot == T(cat.copernic.backend.enums.EstatLot).EN_ESTOC} ? 'Abrir' : 'Acabar'"></span>
                </button>

            </form>

            <a th:href="@{'/lots/editar/' + ${l.id}}"
               th:classappend="${l.estatLot != T(cat.copernic.backend.enums.EstatLot).EN_ESTOC} ? ' btn-brown-disabled' : ' btn-brown-warning'"
               class="btn btn-brown-sm">
                Editar
            </a>

            <a th:if="${l.estatLot != T(cat.copernic.backend.enums.EstatLot).EN_ESTOC}"
               th:href="@{'/lots/' + ${l.id} + '/produccions'}"
               class="btn btn-brown-info btn-brown-sm">
                Producciones
            </a>

            <span th:if="${l.estatLot == T(cat.copernic.backend.enums.EstatLot).EN_ESTOC}"
                  class="btn btn-brown-disabled btn-brown-sm">
                Producciones
            </span>

        </div>
    </div>

</div> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/lots.js"></script>

</body>
</html>
