<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Albaranes cliente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<div th:replace="layout/sidebar :: sidebar"></div>

<div class="content">

    <h2 class="mb-4">Lista de albaranes de cliente</h2>

    <div th:if="${ok}" class="alert alert-success" th:text="${ok}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    
    <form method="get" id="filterForm" class="mb-4 p-3 rounded shadow-sm" style="background-color: #efebe9; border: 1px solid #d7b899;">
        <div class="row g-2 align-items-end mb-3">
            <div class="col-md-2 col-sm-6">
                <label class="form-label text-muted small fw-bold mb-1">Fecha Producción</label>
                <input type="date" name="dataProduccio" class="form-control form-control-sm" th:value="${param.dataProduccio}">
            </div>
            <div class="col-md-2 col-sm-6">
                <label class="form-label text-muted small fw-bold mb-1">Cliente</label>
                <input type="text" name="nomClient" class="form-control form-control-sm" th:value="${param.nomClient}" placeholder="Nombre...">
            </div>
            <div class="col-md-2 col-sm-6">
                <label class="form-label text-muted small fw-bold mb-1">Registrado por</label>
                <input type="text" name="nomUsuari" class="form-control form-control-sm" th:value="${param.nomUsuari}" placeholder="Nombre o apellidos...">
            </div>
            <div class="col-md-2 col-sm-6">
                <label class="form-label text-muted small fw-bold mb-1">Estado</label>
                <select name="estatAlbaraClient" class="form-select form-select-sm">
                    <option value="">Todos</option>
                    <option th:each="e : ${T(cat.copernic.backend.enums.EstatAlbaraClient).values()}"
                            th:value="${e}"
                            th:selected="${e.name() == param.estatAlbaraClient?.toString()}"
                            th:text="${e == T(cat.copernic.backend.enums.EstatAlbaraClient).LLIURAT ? 'Entregado' : 'No entregado'}">
                    </option>
                </select>
            </div>

            <div class="col-md-4 col-sm-12 d-flex gap-2">
                <button type="submit" class="btn btn-brown-primary btn-brown-sm flex-grow-1">Filtrar</button>
                <a href="/albarans-client" class="btn btn-brown-warning btn-brown-sm flex-grow-1">Limpiar</a>
            </div>
        </div>

        <hr style="border-color: #d7b899; opacity: 0.5;" class="m-0 mb-2">

        <div class="d-flex justify-content-end align-items-center gap-2 mt-2">
            <label class="text-muted small fw-bold mb-0">Ordenar por:</label>
            <div class="input-group input-group-sm w-auto shadow-sm">
                <select name="sortField" class="form-select" onchange="document.getElementById('filterForm').submit()" style="border-color: #d7b899; min-width: 130px;">
                    <option value="dataProduccio" th:selected="${sortField == 'dataProduccio'}">Fecha</option>
                    <option value="client" th:selected="${sortField == 'client'}">Cliente</option>
                    <option value="registratPer" th:selected="${sortField == 'registratPer'}">Registrado por</option>
                    <option value="estat" th:selected="${sortField == 'estat'}">Estado</option>
                </select>

                <input type="hidden" name="asc" id="ascInput" th:value="${asc}">

                <button class="btn" style="background-color: #8d6e63; color: white; border-color: #8d6e63;" type="button" onclick="toggleAsc()">
                    <span th:text="${asc ? '⬆️ Asc' : '⬇️ Desc'}"></span>
                </button>
            </div>
        </div>
    </form>

    <script>
        function toggleAsc() {
            const ascInput = document.getElementById('ascInput');
            ascInput.value = ascInput.value === 'true' ? 'false' : 'true';
            document.getElementById('filterForm').submit();
        }
    </script>

    <!-- LISTA -->
    <div th:each="ac : ${albarans}" class="card-item d-flex flex-column mb-3">

        <div class="d-flex justify-content-between align-items-center w-100">
            
            <div>
                <h5 class="mb-1">
                    <span th:text="${ac.client.nom}"></span>
                    -
                    <span th:text="${#temporals.format(ac.dataProduccio, 'dd/MM/yyyy')}"></span>
                </h5>

                <small class="text-muted">
                    Líneas:
                    <span th:text="${#lists.size(ac.linies)}"></span>
                </small>
                <br>

                <span class="badge"
                      th:classappend="${ac.estatAlbaraClient == T(cat.copernic.backend.enums.EstatAlbaraClient).LLIURAT} 
                          ? ' bg-success' : ' bg-danger'"
                      th:text="${ac.estatAlbaraClient == T(cat.copernic.backend.enums.EstatAlbaraClient).LLIURAT} 
                          ? 'Entregado' : 'No entregado'">
                </span>
                <br>

                <small class="text-muted mt-2 d-inline-block">
                    Preparado por: 
                    <span class="fw-semibold text-secondary" 
                          th:text="${ac.registratPer != null ? ac.registratPer.nom + ' ' + ac.registratPer.cognoms : 'Sistema'}">
                    </span>
                </small>
            </div>

            <div class="d-flex align-items-center gap-2">

                <button type="button" 
                        class="btn btn-brown-secondary btn-brown-sm"
                        data-bs-toggle="collapse" 
                        th:attr="data-bs-target='#collapseLineas-' + ${ac.id}">
                    Ver detalles
                </button>

                <form th:action="@{'/albarans-client/canviar-estat/' + ${ac.id}}"
                      method="post"
                      th:if="${ac.estatAlbaraClient == T(cat.copernic.backend.enums.EstatAlbaraClient).NO_LLIURAT}">
                    <button type="submit" class="btn btn-brown-primary btn-brown-sm">
                        Entregar
                    </button>
                </form>

                <a th:href="@{'/albarans-client/editar/' + ${ac.id}}"
                   class="btn btn-brown-warning btn-brown-sm"
                   th:classappend="${ac.estatAlbaraClient != T(cat.copernic.backend.enums.EstatAlbaraClient).NO_LLIURAT} 
                       ? ' btn-brown-disabled'">
                    Editar
                </a>

                <button type="button"
                        class="btn btn-brown-delete btn-brown-sm btn-delete-albara"
                        data-bs-toggle="modal"
                        data-bs-target="#deleteAlbaraModal"
                        th:attr="data-id=${ac.id},data-client=${ac.client.nom}"
                        th:classappend="${ac.estatAlbaraClient != T(cat.copernic.backend.enums.EstatAlbaraClient).NO_LLIURAT} 
                            ? ' btn-brown-disabled'">
                    Eliminar
                </button>

            </div>
        </div>

        <div class="collapse mt-3 w-100" th:id="'collapseLineas-' + ${ac.id}">
            <hr style="border-top: 1px dashed #d7b899; opacity: 1;">
            <p class="fw-bold mb-2 small" style="color: #6d4c41;">Contenido del envío:</p>
            
            <ul class="list-group list-group-flush" style="border-radius: 8px; overflow: hidden;">
                <li th:each="linia : ${ac.linies}" 
                    class="list-group-item d-flex justify-content-between align-items-center"
                    style="background-color: #efebe9; border-color: #d7b899; color: #4e342e;">
                    
                    <span class="fw-medium" th:text="${linia.producte != null ? linia.producte.nom : 'Producto desconocido'}"></span>
                    
                    <span class="badge rounded-pill" style="background-color: #8d6e63; color: white;">
                        <span th:text="${linia.quantitat}"></span> unids.
                    </span>
                    
                </li>
            </ul>
        </div>

    </div>

    <!-- CREAR -->
    <a href="/albarans-client/nouAlbaraClient" class="btn btn-brown-primary btn-brown-lg mt-3">
        + Crear albarán
    </a>

</div> 

<form id="deleteAlbaraForm" method="post"></form>

<div th:replace="fragments/modalAlbaransClient :: modalAlbaransClient"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/albaransClient.js"></script>

</body>
</html>
